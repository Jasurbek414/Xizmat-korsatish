# service-core "core" konteyneri - BIRLASHTIRILGAN nginx konfiguratsiyasi.
# Bu fayl avvalgi IKKI qatlamni birlashtiradi:
#   1) tashqi proxy-nginx.conf (Cloudflare Tunnel qatlami - rate limit,
#      xavfsizlik sarlavhalari, CSP, real-IP)
#   2) frontend-admin/nginx.conf (frontend konteyneridagi ichki qatlam -
#      statik dist/ xizmat qilish + /api//ws/ ga qo'shimcha proxy)
# Ikkinchisining ORTIQCHA /api//ws/ proxy qatlami OLIB TASHLANDI - endi
# faqat BITTA nginx qatlami bor, ikki marta proksilash shart emas.
#
# MUHIM O'ZGARISH: backend uchun avvalgi "resolver 127.0.0.11 valid=10s" +
# "set $upstream_x" hiylasi olib tashlandi. U Docker DNS orqali konteyner
# IP'sining eskirib qolishidan (deploy paytida konteyner qayta yaratilib
# yangi IP olishidan) himoya qilish uchun edi. Bitta konteynerda BUNDAY DNS
# eskirishi tuzilishan MUMKIN EMAS - backend endi shu konteynerning o'zida,
# 127.0.0.1 orqali, doim bir xil manzilda. Shuning uchun bu murakkablikni
# olib tashlash REGRESSIYA emas - ildiz sababi butunlay yo'qolgani uchun
# xavfsiz.
#
# ASTERISK HAM ENDI SHU KONTEYNERDA (2026-09-09: to'liq bitta konteynerga
# jamlash) - /ws/sip location'i endi "127.0.0.1:8088" ga ishora qiladi,
# Docker DNS umuman kerak emas.
#
# BACKEND'NING PORTI 8090 (8080 EMAS): nginx pastda o'zi ham 8080-portda
# tinglaydi (Cloudflare Tunnel'ning "servicecore-api.ecos.uz" yo'nalishi
# uchun, tashqi portda o'zgarish yo'q). Bitta konteynerda ikkalasi ham
# 8080'ni band qilolmaydi - shuning uchun backend'ning ICHKI porti (Spring
# Boot SERVER_PORT environment orqali) 8090ga o'zgartirildi. Bu FAQAT ichki
# manzil - nginx tashqariga hali ham 3005 va 8080 orqali xizmat qiladi,
# hech qanday tashqi/Cloudflare sozlamasi o'zgarishi shart emas.
#
# real_ip_header / set_real_ip_from (pastda) esa SO'ZMA-SO'Z saqlanadi -
# bu ikkalasi ilgari HAQIQIY ishlab chiqarish xatosini (rate limit hamma
# uchun GLOBAL bo'lib qolgani) tuzatgan, cloudflared bilan nginx hali ham
# bir xil tarmoq/konteynerda bo'lishi davom etadi - o'zgartirishga hech
# qanday sabab yo'q.
real_ip_header CF-Connecting-IP;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self' blob: wss://servicecore.ecos.uz https://servicecore-api.ecos.uz https://router.project-osrm.org https://nominatim.openstreetmap.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=()" always;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

server {
    listen 3005;
    listen [::]:3005;

    # MUHIM: bu blokda (va pastdagi location'larda) add_header ATAYIN
    # yozilmaydi - nginx'da add_header meros faqat joriy darajada BIRORTA
    # ham add_header bo'lmasa ishlaydi. Yuqoridagi xavfsizlik sarlavhalari
    # shu sababli shu yerga TAKRORLANMAYDI.

    # Frontend'ning o'z ichki nginx qatlami endi yo'q - statik dist/ shu
    # yerning o'zida, to'g'ridan-to'g'ri xizmat qilinadi (avvalgi ikkinchi
    # proxy hop olib tashlandi).
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Yangi build'dagi asset'lar yuklanishini kafolatlash uchun index.html
        # (va SPA fallback qilingan barcha yo'llar) keshlanmaydi - avvalgi
        # frontend-admin/nginx.conf dagi bilan bir xil xatti-harakat.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Content-Disposition "attachment";
        autoindex off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/sip {
        # Asterisk endi SHU konteynerning o'zida (2026-09-09: to'liq bitta
        # konteynerga jamlash) - manzil "127.0.0.1:8088". Asterisk'ning
        # PJSIP WebSocket transporti (res_http_websocket) HAR DOIM aniq "/ws"
        # yo'lida ishlaydi, shuning uchun proxy_pass'da ANIQ "/ws" yo'li
        # ko'rsatiladi ("/ws/sip" qismini shu bilan ALMASHTIRADI).
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Cloudflare tunnel'dagi alohida "servicecore-api.ecos.uz" hostnomi shu portga
# to'g'ridan-to'g'ri yo'naltirilgan (tashqi integratsiyalar backend API'ga
# bevosita shu orqali kirishadi).
server {
    listen 8080;
    listen [::]:8080;

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
