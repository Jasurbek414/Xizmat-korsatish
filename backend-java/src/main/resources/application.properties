spring.application.name=core

# Database Connection Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/service_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2026-09-09 ishlash tezligi auditi: standart Hikari max pool 10, lekin
# open-in-view=true tufayli har bir so'rov o'zining butun davomida (jumladan
# LAZY assotsiatsiyalarni serializatsiya qilish va ba'zi joylardagi tashqi
# HTTP chaqiruvlar davomida) bitta ulanishni band qilib turadi - yuklama
# ostida 10 ta tez tugab, navbatga tiqilib qolish xavfi bor edi.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 2026-09-09 ishlash tezligi auditi: LAZY assotsiatsiyalar (Order.items va
# boshqalar) hech qanday batching sozlamasisiz N ta qatorni N ta ALOHIDA
# so'rov bilan yuklardi (klassik N+1). Bu sozlama Hibernate'ga ularni
# "WHERE id IN (...)" ko'rinishida guruhlab yuklashga buyuradi - kod
# tuzilishini o'zgartirmasdan so'rovlar sonini kamaytiradi.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Open-in-view: Hibernate sessiyasini butun request davomida ochiq saqlash.
# Bu Jackson LAZY proksilarni serializatsiya qilganda Hibernate'ga ma'lumotlarni
# yuklash imkonini beradi. Agar false bo'lsa, LAZY maydonlarga murojaat qilish
# LazyInitializationException bilan tugaydi.
spring.jpa.open-in-view=true

# Jackson serializatsiya sozlamalari
# Hibernate LAZY proksilari (masalan, Order.client, Order.worker) Jackson uchun
# "bo'sh bean" hisoblanadi. fail-on-empty-beans=false bo'lmasa, Jackson proksilarni
# serializatsiya qilolmay InvalidDefinitionException tashlaydi.
spring.jackson.serialization.fail-on-empty-beans=false

# JWT imzo kaliti - Spring Boot buni JWT_SECRET nomli OS environment o'zgaruvchisidan avtomatik
# o'qiydi (JwtTokenProvider'dagi @Value("${JWT_SECRET:}") orqali). PRODUCTIONDA albatta
# docker-compose/.env orqali o'rnatilishi shart, aks holda dev-fallback kalit ishlatiladi.

# CORS uchun ruxsat etilgan originlar (vergul bilan ajratilgan). Bo'sh bo'lsa faqat localhost'ga ruxsat.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3005,http://localhost:5173}

# Firebase Cloud Messaging (push bildirishnoma) uchun service account JSON fayli yo'li -
# FirebaseConfig.java buni FIREBASE_SERVICE_ACCOUNT_PATH OS environment o'zgaruvchisidan
# to'g'ridan-to'g'ri o'qiydi. Bo'sh qoldirilsa, push funksiyasi jimgina o'chirilgan holda qoladi.

# Spring Security TRACE darajasi vaqtinchalik diagnostika uchun ishlatilgan
# edi (DELETE 403 muammosi) - production'da har bir so'rov uchun 13 qatorlik
# filtr zanjiri logini yozib, diskni to'ldirar va haqiqiy xatolarni shovqin
# ostida ko'mib tashlardi. Muammo hal qilingandan keyin ham unutilib qolgan.
logging.level.org.springframework.security=WARN
