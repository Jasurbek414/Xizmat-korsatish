x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: service-core-db
    mem_limit: 512m
    cpu_shares: 1024
    logging: *default-logging
    environment:
      - POSTGRES_DB=service_db
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      default:
        ipv4_address: 172.24.0.12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend-java
    container_name: service-core-backend
    mem_limit: 1g
    cpu_shares: 1024
    logging: *default-logging
    ports:
      - "0.0.0.0:8082:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3005,http://localhost:5173,https://namifor.ecos.uz,https://namifor-api.ecos.uz,https://servicecore.ecos.uz}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    volumes:
      - ./backend-java/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      default:
        ipv4_address: 172.24.0.13
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend-admin
    container_name: service-core-frontend
    mem_limit: 128m
    cpu_shares: 512
    logging: *default-logging
    ports:
      - "127.0.0.1:3005:80"
    restart: always
    networks:
      default:
        ipv4_address: 172.24.0.11
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: service-core-tunnel
    mem_limit: 128m
    cpu_shares: 512
    logging: *default-logging
    restart: always
    network_mode: "service:proxy"
    user: "root"
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--protocol"
      - "http2"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - proxy

  proxy:
    image: nginx:alpine
    container_name: service-core-proxy
    mem_limit: 128m
    cpu_shares: 512
    logging: *default-logging
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./proxy-nginx.conf:/etc/nginx/conf.d/default.conf
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      - frontend
      - backend
    networks:
      default:
        ipv4_address: 172.24.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3005/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.24.0.0/16
          gateway: 172.24.0.1
