# MUHIM (audit'da topilgan): standart Docker json-file log drayveri hech
# qanday chegarasiz - TRACE darajasidagi loglash (endi o'chirilgan) bilan
# birga disk vaqt o'tishi bilan to'lib ketishi mumkin edi. Har bir xizmatga
# shu standart cheklovni qo'llaymiz (3 fayl x 20MB = xizmat boshiga max 60MB).
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: service-core-db
    logging: *default-logging
    environment:
      - POSTGRES_DB=service_db
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      # MUHIM (xavfsizlik, audit'da topilgan): avval "5437:5432" - bu portni
      # BARCHA tarmoq interfeyslariga (0.0.0.0) ochib, standart "postgres"
      # foydalanuvchi nomi bilan butun internetdan ulanish imkonini berardi
      # (.env'dagi DB_PASSWORD ham ishlab chiqarish uchun zaif). Endi faqat
      # shu serverning o'zidan (127.0.0.1) kirish mumkin - masofadan DB
      # kerak bo'lsa SSH tunnel orqali oching.
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    # MUHIM (2026-07-31 auditda topilgan): "depends_on: db" FAQAT konteyner
    # ishga tushganini bildiradi, PostgreSQL so'rovga TAYYOR ekanini emas.
    # Shu sababli har ko'tarilishda backend baza tayyor bo'lishidan oldin
    # ulanishga urinib, bir necha marta qayta ishga tushardi. pg_isready
    # bilan haqiqiy tayyorlikni tekshiramiz (backend'dagi service_healthy
    # shartiga qarang).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d service_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend-java
    container_name: service-core-backend
    logging: *default-logging
    ports:
      # MUHIM (xavfsizlik, 2026-07-31 auditda topilgan): avval "8082:8080" -
      # ya'ni 0.0.0.0, butun LAN'ga ochiq. Tekshirildi: bu portni HECH KIM
      # ishlatmaydi - nginx backendga ICHKI docker tarmog'i orqali boradi
      # (proxy-nginx.conf: "set $upstream_backend backend:8080"), mobil ilova
      # esa https://namifor-api.ecos.uz (Cloudflare tunnel) orqali
      # (mobile-flutter/lib/core/constants.dart). Endi faqat shu mashinadan -
      # lokal debug uchun ochiq qoladi, tashqaridan yopiq.
      - "127.0.0.1:8082:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3005}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      # Asterisk ARI (REST+WebSocket) bilan aloqa - parol asterisk-config/ari.conf'da
      # o'rnatilgan qiymat bilan BIR XIL bo'lishi SHART, aks holda ARI
      # autentifikatsiyasi muvaffaqiyatsiz tugaydi (avvalgi FREESWITCH_ESL_*
      # invariantining ARI ekvivalenti).
      - ASTERISK_ARI_HOST=asterisk
      - ASTERISK_ARI_PORT=8088
      - ASTERISK_ARI_USERNAME=asterisk
      # MUHIM (xavfsizlik, 2026-07-31 auditda topilgan): bu yerda avval
      # haqiqiy parol standart qiymat (fallback) sifatida ochiq turardi va
      # git'ga tushgan edi. Endi FAQAT .env'dan olinadi va standart qiymat
      # ATAYLAB yo'q - .env'da bo'lmasa konteyner ko'tarilmaydi. Jimgina
      # hammaga ma'lum parol bilan ishga tushib ketishdan shu yaxshi.
      # Qiymat asterisk-config/ari.conf'dagi bilan BIR XIL bo'lishi shart.
      - ASTERISK_ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:?.env faylida ASTERISK_ARI_PASSWORD belgilanishi shart}
      # SIP hisob parollarini bazada shifrlash uchun (SipPasswordConverter).
      - SIP_CREDENTIALS_KEY=${SIP_CREDENTIALS_KEY:-}
    volumes:
      # Push bildirishnoma uchun Firebase Admin SDK service account kaliti (read-only).
      - ./backend-java/firebase-service-account.json:/app/firebase-service-account.json:ro
      # AsteriskTrunkConfigWriter/AsteriskExtensionConfigWriter shu papkaga PJSIP
      # .conf fayllarini yozadi - asterisk xizmati buni pjsip.d ostida ko'rishi
      # uchun ikkalasi ham SHU umumiy papkani ulashi kerak (bind mount, FreeSWITCH
      # gateway/extension volume'lari o'rniga).
      - ./asterisk-config/pjsip.d:/asterisk-pjsip-config
    depends_on:
      db:
        # Baza HAQIQATAN so'rovga tayyor bo'lgunicha kutamiz (db healthcheck'iga
        # qarang) - shunchaki konteyner ishga tushishini emas.
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend-admin
    container_name: service-core-frontend
    logging: *default-logging
    ports:
      # MUHIM (xavfsizlik, 2026-07-31 auditda topilgan): avval "3005:80" -
      # 0.0.0.0. Backend bilan bir xil sabab: nginx frontendga ichki tarmoq
      # orqali boradi ("set $upstream_frontend frontend:80"), tashqi
      # foydalanuvchilar esa Cloudflare tunnel orqali. Host porti faqat
      # lokal debug uchun kerak.
      - "127.0.0.1:3005:80"
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: service-core-tunnel
    logging: *default-logging
    restart: always
    network_mode: "service:proxy"
    user: "root"
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--protocol"
      - "http2"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - proxy

  proxy:
    image: nginx:alpine
    container_name: service-core-proxy
    logging: *default-logging
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./proxy-nginx.conf:/etc/nginx/conf.d/default.conf
      # Mobil APK va shunga o'xshash yuklab olinadigan fayllar uchun (/downloads/ location).
      - ./downloads:/usr/share/nginx/downloads:ro
    depends_on:
      - frontend
      - backend

  # MUHIM (migratsiya, 2026-07): UzTelecom trunk FreeSWITCH orqali ro'yxatdan
  # o'tishni rad etib, faqat Asterisk integratsiyasini talab qilgani uchun
  # FreeSWITCH Asterisk'ga almashtirildi (asl TZ.md ham dastlab Asterisk/AMI'ni
  # ko'zda tutgan edi - bu FreeSWITCH implementatsiyasi keyingi chetlanish
  # bo'lgan). Konfiguratsiya ./asterisk-config/ papkasida (pjsip.conf,
  # extensions.conf, http.conf, ari.conf, rtp.conf).
  asterisk:
    image: andrius/asterisk:22
    container_name: service-core-asterisk
    # MUHIM (jonli sinovda topilgan xato, tuzatildi): "hostname:" ko'rsatilmasa
    # Docker konteynerga tasodifiy raqamdan boshlanishi mumkin bo'lgan hex ID
    # (masalan "17b9ed4a32bb") beradi - Asterisk buni transport-ws uchun
    # ANIQ external_signaling_address sozlanmagani sababli o'zining SIP
    # Contact sarlavhasida (INVITE'larda) hostname sifatida ishlatadi. JsSIP
    # (va aksariyat qat'iy SIP grammatikasi) RAQAM bilan boshlanadigan
    # hostname'ni yaroqsiz deb rad etadi ("error parsing header Contact") -
    # bu operator brauzeriga INVITE yetib borsa ham JIMGINA tashlab
    # yuborilishiga, "newRTCSession" hech qachon chaqirilmasligiga sabab
    # bo'lgan asosiy xato edi. Harf bilan boshlanadigan hostname bu
    # muammoni butunlay yo'q qiladi.
    hostname: asterisk-pbx
    logging: *default-logging
    restart: always
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      # MUHIM (WebRTC media/RTP uchun, avvalgi FreeSWITCH bilan BIR XIL
      # diapazon - host firewall/xavfsizlik guruhi sozlamalarini o'zgartirmaslik
      # uchun ataylab saqlangan): rtp.conf'da ham shu oraliqqa cheklangan.
      - "16384-16483:16384-16483/udp"
      # ARI (8088, ichki HTTP/WebSocket) va PJSIP WebSocket transporti ATAYIN
      # host'ga ochilmaydi - faqat ichki Docker tarmog'i orqali "backend" va
      # "proxy" (nginx) xizmatlari "asterisk" nomi bilan yetadi (xuddi avvalgi
      # FreeSWITCH ESL porti 8021 kabi - to'g'ridan-to'g'ri internetga ochiq
      # bo'lsa PBX'ni to'liq masofadan boshqarish xavfi bo'lardi).
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      # MUHIM: butun /etc/asterisk papkasini bind mount qilib bo'lmaydi -
      # image'ning o'z ichidagi standart fayllarini (modules.conf, logger.conf,
      # asterisk.conf va h.k.) butunlay yashirib qo'yadi va Asterisk
      # "modules.conf invalid or missing" bilan darhol chiqib ketadi (birinchi
      # urinishda aniqlangan xato). Shuning uchun FAQAT o'zimiz yozgan aniq
      # fayllar alohida-alohida bind mount qilinadi - xuddi avvalgi FreeSWITCH
      # dialplan fayllari bilan bir xil naqsh.
      - ./asterisk-config/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk-config/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk-config/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk-config/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk-config/rtp.conf:/etc/asterisk/rtp.conf:ro
      # AsteriskTrunkConfigWriter/AsteriskExtensionConfigWriter (backend) shu
      # papkaga yozadi - pjsip.conf oxiridagi "#include pjsip.d/*.conf" orqali
      # avtomatik o'qiladi (backend'dagi bir xil bind mount'ga qarang).
      - ./asterisk-config/pjsip.d:/etc/asterisk/pjsip.d
      # MUHIM: "andrius/asterisk" image'ida standart MOH (music-on-hold)
      # audio fayllari YO'Q (/var/lib/asterisk/moh/ bo'sh) - musiconhold.conf'dagi
      # [default] klass shu papkani ko'rsatadi. Hold (B-qism) va navbat
      # (C-qism, kutish bridge'i) HAQIQATAN ishlaydi (chaqiriq uzilmaydi),
      # lekin fayl bo'lmagani uchun mijoz musiqa o'rniga jimlik eshitadi.
      # Haqiqiy musiqa uchun istalgan 8kHz'ga mos audio faylni (masalan .wav)
      # shu papkaga qo'yish kifoya - Asterisk qayta ishga tushirilganda avtomatik topadi.
      - ./asterisk-config/moh:/var/lib/asterisk/moh
      - asterisk_data:/var/lib/asterisk

  # TURN server (coturn) - WebRTC ovoz (media) relay.
  # MUHIM SABAB: server Docker Desktop/WSL2 (Windows) da ishlaydi - u WebRTC
  # uchun kerakli UDP RTP portlarini ishonchli uzatolmaydi (host UDP forwarding
  # buzuq, symmetric NAT). Yechim: brauzer media'ni coturn'ga TCP orqali yuboradi
  # (Docker Desktop TCP'ni ISHONCHLI uzatadi), coturn esa PBX'ga ICHKI docker
  # tarmog'i orqali (host UDP forwarding'siz) uzatadi. Shunday qilib buzuq host
  # UDP yo'li butunlay chetlab o'tiladi.
  # Brauzer: turn:<server>:3478?transport=tcp + iceTransportPolicy:'relay'.
  # MUHIM (migratsiya, 2026-07): bu izoh avval FreeSWITCH'ning ICE candidate
  # xatti-harakatiga (ext-rtp-ip/local-network-acl) asoslangan edi - Asterisk'ga
  # o'tishda PJSIP transport'ning tegishli sozlamalari (external_media_address
  # yoki ICHKI Docker IP'sini candidate sifatida e'lon qilish xatti-harakati)
  # 5-bosqichda (haqiqiy qo'ng'iroq sinovi) qayta tekshirilishi kerak - xuddi
  # shu muammo (ICE candidate noto'g'ri IP bilan) Asterisk'da ham chiqishi mumkin.
  coturn:
    image: coturn/coturn:latest
    container_name: service-core-coturn
    logging: *default-logging
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      # 443/TLS (turns) - ISP'lar 3478 ni bloklashi mumkin, lekin 443 (HTTPS
      # porti) deyarli har doim ochiq. Brauzer turns:<ip>:443?transport=tcp
      # bilan ulanadi - HTTPS trafik kabi ko'rinadi, hech qaysi ISP bloklaмaydi.
      - "443:443/tcp"
    volumes:
      - ./coturn-certs:/certs:ro
    command:
      - "-n"
      - "--log-file=stdout"
      # VAQTINCHALIK (2026-07-30 diagnostikasi): batafsil log - brauzer TURN
      # allocation so'rovi HAQIQATAN yetib kelayotganini ko'rish uchun. Standart
      # rejimda coturn allocation'larni yozmaydi, shuning uchun "log bo'sh"
      # holati "so'rov kelmadi" degan ma'noni BERMAYDI - shuni aniqlash uchun
      # kerak. Muammo hal bo'lgach BU QATORNI OLIB TASHLANG (batafsil log
      # har media paketni yozib diskni tez to'ldiradi).
      - "-v"
      - "--listening-port=3478"
      - "--tls-listening-port=443"
      - "--cert=/certs/turn_cert.pem"
      - "--pkey=/certs/turn_pkey.pem"
      - "--realm=namifor.ecos.uz"
      - "--fingerprint"
      - "--lt-cred-mech"
      # MUHIM (xavfsizlik, 2026-07-31 auditda topilgan): TURN login/parol avval
      # shu yerda ochiq matnda turardi va git'ga tushgan edi. Endi .env'dan
      # olinadi (standart qiymat ATAYLAB yo'q).
      # DIQQAT: bu ma'lumotlar brauzerga ham kerak, shuning uchun
      # frontend-admin/src/features/telephony/hooks/useSipPhone.js ichida ham
      # bor - parolni almashtirsangiz IKKALA joyni ham yangilang, aks holda
      # TURN autentifikatsiyasi buziladi va ovoz umuman ulanmaydi.
      - "--user=${TURN_USER:?.env faylida TURN_USER belgilanishi shart}:${TURN_PASSWORD:?.env faylida TURN_PASSWORD belgilanishi shart}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-dtls"
      - "--no-cli"
      - "--no-multicast-peers"

volumes:
  postgres_data:
  asterisk_data:
