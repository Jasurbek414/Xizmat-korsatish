;
; Asterisk modul yuklash sozlamalari.
;
; MUHIM (2026-07-31 auditda topilgan): bu fayl image'ning O'Z modules.conf
; nusxasidan olingan (autoload + mavjud noload'lar AYNAN saqlangan) va
; ustiga faqat qo'shimcha noload qatorlari qo'shilgan. Butun /etc/asterisk
; papkasini mount qilib bo'lmaydi - bu image standart fayllarini yashirib,
; Asterisk'ni "modules.conf invalid or missing" bilan darhol o'chiradi
; (docker-compose.yml dagi izohga qarang). Shuning uchun FAQAT shu bitta
; fayl alohida mount qilinadi.
;
[modules]
autoload=yes

; --- Image'da allaqachon bor edi, o'zgarishsiz saqlandi ---
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

; --- 2026-07-31 da qo'shildi: konteynerda ovoz qurilmasi YO'Q ---
; Bu modullar ALSA/OSS ovoz kartasini ochishga urinadi va har ishga
; tushishda ~41 ta "ALSA lib ... No such file or directory" xatosini
; yozadi. Ular butunlay foydasiz: server WebRTC/SIP orqali ishlaydi,
; hech qachon xostning ovoz kartasidan foydalanmaydi. Loglarni tozalaydi -
; haqiqiy xatolar shovqin ichida yo'qolib ketmasligi uchun muhim.
noload = chan_alsa.so
noload = chan_oss.so
noload = chan_console.so

; LDAP realtime backend'i ishlatilmaydi, lekin har ishga tushishda
; "No directory URL or host found" + "Cannot load LDAP RealTime driver"
; xatolarini beradi. Loyiha konfiguratsiyani oddiy .conf fayllar orqali
; boshqaradi (AsteriskTrunkConfigWriter pjsip.d/ ga yozadi).
noload = res_config_ldap.so

; Telefon apparatlarini avtomatik sozlash (phoneprov) ishlatilmaydi -
; "Unable to find a valid server address or name" ogohlantirishini beradi.
noload = res_phoneprov.so
