; ============================================================================
; Dialplan - barcha marshrutlash qarori Java backendda (ARI Stasis ilovasi
; orqali) qabul qilinadi, xuddi hozirgi FreeSWITCH arxitekturasidagi kabi
; (park + CHANNEL_PARK ESL hodisasi + backend bridge qarori). Bu yerda faqat
; qo'ng'iroqni "telephony-app" Stasis ilovasiga topshirish kifoya - eski
; trunk_answered.xml/public_incoming.xml'dagi FreeSWITCH-ga xos dialplan
; mantiqi endi kerak emas.
; ============================================================================

[from-uztelecom]
; UzTelecom trunkdan kiruvchi qo'ng'iroq - Java backend (AsteriskEventListener)
; StasisStart hodisasini kutib, qo'ng'iroq qiluvchi kompaniyani (trunk
; endpoint nomi orqali) va onlayn operatorlarni aniqlab, bridge qaror qiladi.
exten => _X.,1,NoOp(UzTelecom'dan kiruvchi qo'ng'iroq: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(telephony-app,inbound-trunk)
 same => n,Hangup()

[from-internal]
; Brauzer/WebRTC operator extension'idan chiquvchi harakat (masalan chiquvchi
; qo'ng'iroqning operator oyog'i) - backend ARI orqali originate qilganda
; kanal shu contextga kirmasdan to'g'ridan-to'g'ri Stasis ilovasiga
; yo'naltiriladi (channel yaratilishida app=telephony-app ko'rsatiladi),
; lekin operator softphone o'zi biror raqam tersa ham shu yerga tushadi.
exten => _X.,1,NoOp(Ichki/WebRTC harakat: ${EXTEN})
 same => n,Stasis(telephony-app,internal)
 same => n,Hangup()
