; RTP media port oralig'i - avvalgi FreeSWITCH sozlamasi bilan BIR XIL
; diapazon (16384-16483, standart 16384-32768 o'rniga toraytirilgan) - host
; firewall/xavfsizlik guruhi sozlamalarini o'zgartirmaslik uchun ataylab
; saqlangan (docker-compose.yml'dagi "ports:" shu diapazonni ochadi).
[general]
rtpstart=16384
rtpend=16483

; ============================================================================
; MUHIM (2026-07-30 jonli diagnostikasi): qo'ng'iroqlarda ovoz HECH QACHON
; ulanmagan (call_sessions'dagi 20 ta yozuv, hammasi duration=0). SIP izi
; ko'rsatdi: brauzer INVITE'ga 180 Ringing yuboradi, keyin "200 OK" umuman
; yubormaydi - ya'ni WebRTC ICE nomzod to'plash muvaffaqiyatsiz tugaydi.
;
; SABAB: Asterisk SDP'da FAQAT bitta ICE nomzod e'lon qilardi -
;   a=candidate:... 172.19.0.5 16424 typ host
; ya'ni o'zining ICHKI Docker IP'sini. Bu manzilga brauzer HECH QANDAY
; holatda yetib bormaydi: Docker Desktop (Windows) xostdan konteyner
; tarmog'iga marshrut BERMAYDI - sinovda tasdiqlangan (172.19.0.5 ping'ga
; javob bermaydi, marshrut jadvalida 172.19.* yo'q). Shu sababli ishlaydigan
; ICE juftligi umuman qolmaydi.
;
; NIMA UCHUN transport'dagi external_media_address YETARLI EMAS: u faqat
; SDP'ning "c=" qatorini o'zgartiradi, ICE NOMZODLARIGA (a=candidate)
; ta'sir qilmaydi. WebRTC esa aynan ICE nomzodlaridan foydalanadi.
;
; YECHIM (ice_host_candidates, Asterisk 18.21+/20.6+/21.1+ da mavjud):
; ichki manzilni brauzer HAQIQATAN yetadigan manzilga almashtiramiz.
; docker-compose.yml RTP diapazonini (16384-16483/udp) xostga ochadi,
; shuning uchun 192.168.100.11 orqali shu portlarga yetish mumkin.
;   - 192.168.100.11 = serverning LAN manzili. Operator brauzeri server bilan
;     BIR XIL tarmoqda ishlaganda (hozirgi holat) bu manzil to'g'ridan-to'g'ri
;     ishlaydi va router sozlamasi TALAB QILINMAYDI.
;   - Masofadagi operatorlar uchun bu yetarli emas: ular uchun coturn (TURN
;     relay) yo'li kerak, u esa routerda 3478/TCP+UDP -> 192.168.100.11
;     forwarding sozlanishini talab qiladi.
; Server LAN IP'si o'zgarsa (DHCP) - bu qiymatni yangilash SHART, shuning
; uchun routerda serverga statik IP (DHCP reservation) berish tavsiya etiladi.
; Asterisk o'zining OCHIQ IP'sini STUN orqali aniqlab, qo'shimcha "srflx"
; nomzod e'lon qilishi uchun. Jonli sinovda TASDIQLANDI - Asterisk endi
; "213.230.93.109 ... typ srflx" nomzodini ham e'lon qiladi.
stunaddr = stun.l.google.com:19302

; MUHIM: ice_host_candidates [general] ichidagi kalit EMAS, ALOHIDA BO'LIM.
; Avval xato tarzda [general] ostiga yozilgan edi va Asterisk uni JIMGINA
; e'tiborsiz qoldirdi (xato bermaydi!) - SDP'da host nomzod hamon 172.19.0.5
; bo'lib qolgani jonli SIP izida aniqlandi.
[ice_host_candidates]
; MUHIM (2026-07-31 auditda topilgan JIDDIY xato): bu yerda avval
; "172.19.0.5" turardi, lekin Asterisk o'sha paytda 172.19.0.7 da edi -
; 172.19.0.5 ni coturn olib qo'ygan edi. Sabab: docker-compose.yml da
; statik IP belgilanmagani uchun Docker manzillarni ishga tushish
; TARTIBIGA qarab beradi va ular har qayta yaratishda aralashadi.
; Natijada bu mapping JIMGINA ishlamay qolardi - Asterisk mappingda
; bo'lmagan IP'ni e'lon qilardi va u 192.168.100.11 ga almashtirilmasdi.
; Ya'ni tuzatish ba'zan ishlab, ba'zan ishlamasdi.
; Endi docker-compose.yml da asterisk'ga STATIK 172.19.0.15 berilgan -
; shuning uchun bu qiymat barqaror. IKKALASI BIR XIL BO'LISHI SHART:
; compose'dagi ipv4_address o'zgarsa, bu qator ham o'zgarishi kerak.
172.19.0.15 => 192.168.100.12
