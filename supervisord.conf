; service-core - BITTA konteynerga TO'LIQ jamlangan protsess supervisori.
; Postgres + backend + nginx + cloudflared + Asterisk + coturn - hammasi
; shu yerda.
;
; priority= - ishga tushish TARTIBI (kichik = oldinroq). Postgres birinchi,
; keyin Asterisk/coturn (real-vaqt, ustuvor), keyin backend (DB tayyor
; bo'lishini wait-for-db.sh orqali kutadi), keyin nginx, oxirida cloudflared.
;
; Har protsess run-with-priority.sh orqali - CPU "nice" va OOM
; o'ldirilganda kernelning ustuvorligini (oom_score_adj) belgilaydi.
; Ustuvorlik: Asterisk eng himoyalangan (qo'ng'iroq davomida o'lishi eng
; yomon holat) -> coturn -> Postgres (WAL orqali tiklanadi, lekin baribir
; himoyalanadi) -> nginx/cloudflared (stateless, arzon qayta tushish) ->
; backend JVM eng "qurbon qilinadigan" (xotira sizishi ehtimoli eng yuqori).
;
; DIQQAT (port to'qnashuvi): nginx 8080-portda (Cloudflare Tunnel'ning
; "servicecore-api.ecos.uz" yo'nalishi uchun) tinglaydi - bu tashqi portga
; mos, o'ZGARMAYDI. Spring Boot backend esa endi ICHKI 8090-portda (nginx
; bilan to'qnashmasligi uchun, SERVER_PORT orqali).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/usr/local/bin/run-with-priority.sh -700 0 /usr/local/bin/postgres-entrypoint.sh
priority=5
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log

[program:asterisk]
command=/usr/local/bin/run-with-priority.sh -900 -5 /usr/sbin/asterisk -f -vvv
priority=10
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/asterisk.log
stderr_logfile=/var/log/supervisor/asterisk.err.log

[program:coturn]
command=/usr/local/bin/run-with-priority.sh -800 -5 /usr/bin/turnserver -n --log-file=stdout -v --listening-port=3478 --tls-listening-port=443 --cert=/certs/turn_cert.pem --pkey=/certs/turn_pkey.pem --realm=servicecore.ecos.uz --fingerprint --lt-cred-mech --user=%(ENV_TURN_USER)s:%(ENV_TURN_PASSWORD)s --min-port=49160 --max-port=49200 --no-cli --no-multicast-peers
priority=20
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/coturn.log
stderr_logfile=/var/log/supervisor/coturn.err.log

[program:backend]
; wait-for-db.sh - Postgres HAQIQATAN so'rovga tayyor bo'lgunicha kutadi.
; -Xmx konteyner umumiy xotirasidan ancha past - bitta leaky protsess
; butun konteynerni bo'g'ib qo'ymasligi uchun.
command=/usr/local/bin/run-with-priority.sh 300 10 /usr/local/bin/wait-for-db.sh /usr/bin/java -Xmx1200m -jar /app/app.jar
priority=30
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:nginx]
command=/usr/local/bin/run-with-priority.sh 0 0 nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:cloudflared]
command=/usr/local/bin/run-with-priority.sh 0 0 /usr/local/bin/cloudflared tunnel --no-autoupdate --protocol http2 run --token %(ENV_CLOUDFLARE_TUNNEL_TOKEN)s
priority=50
autorestart=true
stdout_logfile=/var/log/supervisor/cloudflared.log
stderr_logfile=/var/log/supervisor/cloudflared.err.log
