# MUHIM (xavfsizlik, audit'da topilgan): "tunnel" xizmati docker-compose'da
# "network_mode: service:proxy" bilan ishlaydi - ya'ni cloudflared BU
# konteyner bilan bir xil tarmoq nazoratini (netns) ulashadi va nginx'ga
# doim "localhost" orqali murojaat qiladi. Natijada $remote_addr HAR DOIM
# 127.0.0.1 edi - HAQIQIY internet mijozi IP'si emas. Bu pastdagi
# limit_req'ni butunlay ishlamaydigan holatga keltirardi: BARCHA
# foydalanuvchilar (butun internet) bitta umumiy "127.0.0.1" cho'ntagiga
# tushib, bitta hujumchi butun platformani hamma uchun bloklab qo'yishi
# mumkin edi. cloudflared HTTP so'rovga haqiqiy mijoz IP'sini
# "CF-Connecting-IP" sarlavhasida qo'shib beradi - shundan foydalanib
# $remote_addr'ni HAQIQIY qiymatga almashtiramiz (faqat 127.0.0.1'dan
# kelgan so'rovlarga ishonamiz - bu yagona manba, nginx tashqariga
# to'g'ridan-to'g'ri ochiq emas).
real_ip_header CF-Connecting-IP;
set_real_ip_from 127.0.0.1;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Login - parol taxmin qilish (brute-force) hujumidan himoya uchun ALOHIDA,
# ancha qattiqroq zona. Umumiy api_limit (10r/s = ~daqiqasiga 600) portal
# davomida keng foydalanish uchun mo'ljallangan, lekin login kabi nozik
# endpoint uchun amalda cheklovsiz.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

server {
    listen 3005;
    listen [::]:3005;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mobil ilova APK'sini masofadagi xodimlar to'g'ridan-to'g'ri havola orqali
    # yuklab olishi uchun (masalan https://namifor.ecos.uz/downloads/app.apk).
    # ./downloads papkasi (docker-compose'da bind mount) orqali xizmat qiladi -
    # autentifikatsiyasiz, chunki maqsad aynan shu: havolaga ega har kim
    # o'rnatib olishi.
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Content-Disposition "attachment";
        autoindex off;
        # MUHIM: APK tez-tez (har build'da) yangilanadi, lekin fayl NOMI bir
        # xil qoladi - Cloudflare va foydalanuvchi brauzeri standart holatda
        # bunday statik faylni soatlab keshlaydi (nginx'ning standart
        # "Cache-Control: max-age=..." xatti-harakati "expires" yo'q bo'lsa
        # ham ishlab turadi) va fayl serverda yangilangandan keyin ham eski
        # nusxani ko'rsatishda davom etaveradi - yuklab oluvchi buni
        # bilmaydi. Keshlashni butunlay o'chiramiz - shunda har safar aniq
        # ENG YANGI fayl kelishi kafolatlanadi.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /api/v1/auth/login {
        # Aniq (exact-match) location - nginx bunga pastdagi "/api/" prefiks
        # location'idan QAT'IY NAZAR ustunlik beradi, joylashuv tartibidan
        # qat'i nazar - shuning uchun login har doim qattiqroq zonaga tushadi.
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8080/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Standart 60s o'rniga - uzoq muddatli WebSocket ulanishi (chaqiruv
        # nazorat kanali) vaqtidan oldin uzilib qolmasligi uchun.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/sip {
        # MUHIM (migratsiya, 2026-07): UzTelecom faqat Asterisk integratsiyasini
        # qabul qilgani uchun FreeSWITCH Asterisk'ga almashtirildi. Brauzer
        # bu yerga (nginx) hamon https/wss orqali ulanadi (TLS shu yerda, ushbu
        # nginx qatlamida tugaydi - Cloudflare tunnel orqali kelgan trafik uchun
        # ham xuddi shunday), lekin ICHKI hop (nginx -> asterisk) endi ODDIY ws
        # (TLS'siz) - Asterisk PJSIP WebSocket transporti (asterisk-config/pjsip.conf
        # dagi transport-ws) faqat Docker ichki tarmog'idan yetiladi, boshqa
        # ichki proksilanadigan yo'nalishlar (/api/, /ws/telephony) bilan bir xil
        # naqsh - qo'shimcha sertifikat boshqaruvi shart emas.
        # MUHIM: Asterisk'ning PJSIP WebSocket transporti (res_http_websocket)
        # HAR DOIM aniq "/ws" yo'lida ishlaydi (sozlanmaydi) - brauzer esa
        # "/ws/sip"ga ulanadi (eski FreeSWITCH sozlamasidan meros, o'zgartirish
        # frontend/mobil kodini ham o'zgartirishni talab qilardi). Shuning
        # uchun proxy_pass'da ANIQ "/ws" yo'li ko'rsatiladi - nginx location
        # bilan mos kelgan qismni ("/ws/sip") shu bilan ALMASHTIRADI. Bu
        # to'g'ri sozlanmasa Asterisk "404 Not Found" bilan javob berardi
        # (jonli sinovda WebSocket handshake muvaffaqiyatsizligi sifatida
        # aniqlangan - brauzer konsolida "WebSocket connection ... failed").
        proxy_pass http://asterisk:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Standart 60s o'rniga - jonli sinovda ulanish har 1-2 daqiqada
        # uzilib-qayta ulanayotgani aniqlangan edi (bo'sh turgan WebSocket
        # ulanishi muddati tugashi sababli).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Cloudflare tunnel'da alohida "namifor-api.ecos.uz" hostnomi shu portga
# to'g'ridan-to'g'ri yo'naltirilgan (tashqi integratsiyalar backend API'ga
# bevosita shu orqali kirishadi). Endi rate-limit va xavfsizlik header'lari bilan.
server {
    listen 8080;
    listen [::]:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8080/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
